<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-VISTA</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<style>
  body { background:#f5f7fb; }
  .card-flip { perspective: 1000px; }
  .md h1,.md h2,.md h3{font-weight:700;margin:1rem 0 .4rem}
  .md h2{font-size:1.2rem}.md h3{font-size:1.05rem}
  .md ul{list-style:disc;margin-left:1.4rem}.md ol{list-style:decimal;margin-left:1.4rem}
  .md p{margin:.5rem 0}.md code{background:#eef;padding:0 .25rem;border-radius:4px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const LANGS = ["English","Hindi","Kannada","Tamil","Telugu","Malayalam","Marathi","Bengali","French","Spanish","German"];
const SPEECH = {English:"en-US",Hindi:"hi-IN",Kannada:"kn-IN",Tamil:"ta-IN",Telugu:"te-IN",Malayalam:"ml-IN",Marathi:"mr-IN",Bengali:"bn-IN",French:"fr-FR",Spanish:"es-ES",German:"de-DE"};

async function api(path, opts = {}) {
  const token = localStorage.getItem("token");
  const r = await fetch("/api" + path, {
    method: opts.method || "GET",
    headers: { "Content-Type": "application/json", ...(token ? { Authorization: "Bearer " + token } : {}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (!r.ok) {
    let d = "";
    try { d = (await r.json()).detail; } catch {}
    if (r.status === 401) { localStorage.removeItem("token"); }
    throw new Error(d || r.statusText);
  }
  return r.json();
}

const fmtDur = (s) => { s = s || 0; const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return (h ? h + ":" + String(m).padStart(2,"0") : m) + ":" + String(x).padStart(2,"0"); };

const Md = ({ text }) => (
  <div className="md" dangerouslySetInnerHTML={{ __html: DOMPurify.sanitize(marked.parse(text || "")) }} />
);

const Btn = ({ className = "", ...p }) => (
  <button {...p} className={"px-4 py-2 rounded-lg font-medium transition disabled:opacity-50 " + (className || "bg-indigo-600 text-white hover:bg-indigo-700")} />
);

function speak(text, lang) {
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/[#*_`>-]/g, ""));
  u.lang = SPEECH[lang] || "en-US";
  window.speechSynthesis.speak(u);
}

/* ---------------- Login ---------------- */
function Login({ onAuth }) {
  const [mode, setMode] = useState("login");
  const [u, setU] = useState(""); const [p, setP] = useState("");
  const [err, setErr] = useState(""); const [busy, setBusy] = useState(false);
  const submit = async (e) => {
    e.preventDefault(); setBusy(true); setErr("");
    try {
      const r = await api("/" + mode, { method: "POST", body: { username: u, password: p } });
      localStorage.setItem("token", r.token); localStorage.setItem("username", r.username);
      onAuth(r.username);
    } catch (x) { setErr(x.message); } finally { setBusy(false); }
  };
  return (
    <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-indigo-600 to-purple-700">
      <form onSubmit={submit} className="bg-white rounded-2xl shadow-xl p-8 w-full max-w-sm space-y-4">
        <div>
          <h1 className="text-3xl font-bold text-indigo-700">E-VISTA</h1>
          <p className="text-sm text-gray-500">Educational Video Insight Search, Translation &amp; Abstraction</p>
        </div>
        <input className="w-full border rounded-lg px-3 py-2" placeholder="Username" value={u} onChange={e => setU(e.target.value)} required />
        <input className="w-full border rounded-lg px-3 py-2" type="password" placeholder="Password (min 6)" value={p} onChange={e => setP(e.target.value)} required />
        {err && <p className="text-red-600 text-sm">{err}</p>}
        <Btn className="w-full bg-indigo-600 text-white hover:bg-indigo-700" disabled={busy}>{mode === "login" ? "Log in" : "Create account"}</Btn>
        <p className="text-sm text-center text-gray-600">
          {mode === "login" ? "New here? " : "Have an account? "}
          <a href="#" className="text-indigo-600 underline" onClick={e => { e.preventDefault(); setMode(mode === "login" ? "register" : "login"); }}>
            {mode === "login" ? "Register" : "Log in"}
          </a>
        </p>
      </form>
    </div>
  );
}

/* ---------------- Search ---------------- */
function Search({ onOpen, language }) {
  const [query, setQuery] = useState(""); const [res, setRes] = useState([]);
  const [busy, setBusy] = useState(false); const [err, setErr] = useState("");
  const go = async (e) => {
    e.preventDefault(); if (!query.trim()) return;
    setBusy(true); setErr("");
    try { setRes(await api("/search?q=" + encodeURIComponent(query))); } catch (x) { setErr(x.message); } finally { setBusy(false); }
  };
  const analyse = async (v) => {
    try {
      const r = await api("/process", { method: "POST", body: { ...v, language } });
      onOpen(r.id);
    } catch (x) { setErr(x.message); }
  };
  return (
    <div>
      <form onSubmit={go} className="flex gap-2 mb-4">
        <input className="flex-1 border rounded-lg px-3 py-2" placeholder="Search a topic, e.g. 'binary search trees'" value={query} onChange={e => setQuery(e.target.value)} />
        <Btn disabled={busy}>{busy ? "Searching..." : "Search"}</Btn>
      </form>
      {err && <p className="text-red-600 mb-2">{err}</p>}
      <div className="grid md:grid-cols-2 gap-4">
        {res.map(v => (
          <div key={v.video_id} className="bg-white rounded-xl shadow p-3 flex gap-3">
            <img src={v.thumbnail} className="w-40 h-24 object-cover rounded-lg" />
            <div className="flex-1 min-w-0">
              <p className="font-semibold leading-tight line-clamp-2">{v.title}</p>
              <p className="text-xs text-gray-500">{v.channel} · {fmtDur(v.duration)}</p>
              <Btn className="mt-2 text-sm bg-indigo-600 text-white hover:bg-indigo-700 !py-1" onClick={() => analyse(v)}>Analyse video</Btn>
            </div>
          </div>
        ))}
      </div>
      {!res.length && !busy && <p className="text-gray-500">Search for an educational topic to begin. Keep videos under ~30 minutes for faster processing on CPU.</p>}
    </div>
  );
}

/* ---------------- Quiz ---------------- */
function Quiz({ vid }) {
  const [quiz, setQuiz] = useState(vid.quiz); const [ans, setAns] = useState({});
  const [done, setDone] = useState(false); const [busy, setBusy] = useState(false); const [err, setErr] = useState("");
  const gen = async () => { setBusy(true); setErr("");
    try { const r = await api(`/videos/${vid.id}/quiz`, { method: "POST" }); setQuiz(r.quiz); setAns({}); setDone(false); }
    catch (x) { setErr(x.message); } finally { setBusy(false); } };
  const score = quiz ? quiz.filter((q, i) => ans[i] === q.answer_index).length : 0;
  const submit = async () => { setDone(true); try { await api(`/videos/${vid.id}/quiz/result`, { method: "POST", body: { score, total: quiz.length } }); } catch {} };
  if (!quiz) return <div><Btn onClick={gen} disabled={busy}>{busy ? "Generating..." : "Generate quiz"}</Btn>{err && <p className="text-red-600 mt-2">{err}</p>}</div>;
  return (
    <div className="space-y-4">
      {quiz.map((q, i) => (
        <div key={i} className="bg-white rounded-xl shadow p-4">
          <p className="font-semibold mb-2">{i + 1}. {q.question}</p>
          {q.options.map((o, j) => {
            let cls = "border-gray-200 hover:bg-indigo-50";
            if (ans[i] === j) cls = "border-indigo-500 bg-indigo-50";
            if (done) cls = j === q.answer_index ? "border-green-500 bg-green-50" : ans[i] === j ? "border-red-500 bg-red-50" : "border-gray-200";
            return <label key={j} className={"block border rounded-lg px-3 py-2 mb-1 cursor-pointer " + cls}>
              <input type="radio" className="mr-2" disabled={done} checked={ans[i] === j} onChange={() => setAns({ ...ans, [i]: j })} />{o}</label>;
          })}
          {done && <p className="text-sm text-gray-600 mt-2">💡 {q.explanation}</p>}
        </div>
      ))}
      {!done
        ? <Btn onClick={submit} disabled={Object.keys(ans).length < quiz.length}>Submit answers</Btn>
        : <div className="flex items-center gap-3"><p className="text-lg font-bold">Score: {score} / {quiz.length}</p>
            <Btn className="bg-gray-200 text-gray-800 hover:bg-gray-300" onClick={() => { setAns({}); setDone(false); }}>Retry</Btn></div>}
    </div>
  );
}

/* ---------------- Flashcards ---------------- */
function Cards({ vid }) {
  const [cards, setCards] = useState(vid.cards); const [i, setI] = useState(0); const [flip, setFlip] = useState(false);
  const [busy, setBusy] = useState(false); const [err, setErr] = useState("");
  const gen = async () => { setBusy(true); setErr("");
    try { setCards((await api(`/videos/${vid.id}/flashcards`, { method: "POST" })).cards); }
    catch (x) { setErr(x.message); } finally { setBusy(false); } };
  if (!cards) return <div><Btn onClick={gen} disabled={busy}>{busy ? "Generating..." : "Generate flashcards"}</Btn>{err && <p className="text-red-600 mt-2">{err}</p>}</div>;
  const c = cards[i];
  return (
    <div className="max-w-xl mx-auto">
      <div onClick={() => setFlip(!flip)} className={"cursor-pointer rounded-2xl shadow-lg p-10 min-h-[200px] flex items-center justify-center text-center text-xl font-medium " + (flip ? "bg-indigo-600 text-white" : "bg-white")}>
        {flip ? c.back : c.front}
      </div>
      <p className="text-center text-sm text-gray-500 mt-2">Card {i + 1} / {cards.length} · click card to flip</p>
      <div className="flex justify-center gap-3 mt-3">
        <Btn className="bg-gray-200 text-gray-800 hover:bg-gray-300" onClick={() => { setI((i - 1 + cards.length) % cards.length); setFlip(false); }}>← Prev</Btn>
        <Btn onClick={() => { setI((i + 1) % cards.length); setFlip(false); }}>Next →</Btn>
      </div>
    </div>
  );
}

/* ---------------- Chat ---------------- */
function Chat({ vid }) {
  const [msgs, setMsgs] = useState([]); const [text, setText] = useState(""); const [busy, setBusy] = useState(false);
  const end = useRef();
  useEffect(() => { end.current && end.current.scrollIntoView({ behavior: "smooth" }); }, [msgs]);
  const send = async (e) => {
    e.preventDefault(); if (!text.trim()) return;
    const m = { role: "student", text }; const hist = [...msgs]; setMsgs([...hist, m]); setText(""); setBusy(true);
    try { const r = await api(`/videos/${vid.id}/chat`, { method: "POST", body: { message: m.text, history: hist } }); setMsgs(x => [...x, { role: "tutor", text: r.reply }]); }
    catch (x) { setMsgs(y => [...y, { role: "tutor", text: "⚠️ " + x.message }]); } finally { setBusy(false); }
  };
  return (
    <div className="bg-white rounded-xl shadow p-4">
      <div className="h-80 overflow-y-auto space-y-2 mb-3">
        {!msgs.length && <p className="text-gray-400">Ask anything about this video…</p>}
        {msgs.map((m, i) => <div key={i} className={"max-w-[85%] px-3 py-2 rounded-xl " + (m.role === "student" ? "ml-auto bg-indigo-600 text-white" : "bg-gray-100")}><Md text={m.text} /></div>)}
        {busy && <p className="text-gray-400">Thinking…</p>}<div ref={end} />
      </div>
      <form onSubmit={send} className="flex gap-2">
        <input className="flex-1 border rounded-lg px-3 py-2" value={text} onChange={e => setText(e.target.value)} placeholder="Type your question" />
        <Btn disabled={busy}>Send</Btn>
      </form>
    </div>
  );
}

/* ---------------- Video view ---------------- */
function VideoView({ id, onBack }) {
  const [vid, setVid] = useState(null); const [tab, setTab] = useState("summary");
  const [lang, setLang] = useState("English"); const [translated, setTranslated] = useState({}); const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");

  useEffect(() => {
    let stop = false;
    const tick = async () => {
      try {
        const v = await api("/videos/" + id); if (stop) return; setVid(v);
        if (!["done", "error"].includes(v.status)) setTimeout(tick, 2000);
      } catch (x) { setErr(x.message); }
    };
    tick(); return () => { stop = true; };
  }, [id]);

  if (err) return <p className="text-red-600">{err}</p>;
  if (!vid) return <p>Loading…</p>;

  const translate = async (target) => {
    setBusy(true); setErr("");
    try { const r = await api(`/videos/${id}/translate`, { method: "POST", body: { language: lang, target } }); setTranslated({ ...translated, [target]: { lang, text: r.text } }); }
    catch (x) { setErr(x.message); } finally { setBusy(false); }
  };

  const Tabs = ["summary", "transcript", "quiz", "flashcards", "chat"];
  const youtube = `https://www.youtube.com/embed/${vid.video_id}`;

  return (
    <div>
      <button className="text-indigo-600 mb-3" onClick={onBack}>← Back</button>
      <h2 className="text-xl font-bold">{vid.title || "Processing…"}</h2>
      <p className="text-sm text-gray-500 mb-3">{vid.channel} · {fmtDur(vid.duration)}</p>

      {vid.status !== "done" && vid.status !== "error" && (
        <div className="bg-white rounded-xl shadow p-4 mb-4">
          <p className="font-medium capitalize">{vid.status}…</p>
          <div className="w-full bg-gray-200 rounded-full h-3 my-2"><div className="bg-indigo-600 h-3 rounded-full transition-all" style={{ width: vid.progress + "%" }} /></div>
          <p className="text-sm text-gray-500">{vid.message}</p>
        </div>
      )}
      {vid.status === "error" && <div className="bg-red-50 border border-red-300 text-red-700 rounded-xl p-4 mb-4">Processing failed: {vid.message}</div>}

      <div className="grid lg:grid-cols-3 gap-4">
        <div className="lg:col-span-1"><iframe className="w-full aspect-video rounded-xl" src={youtube} allowFullScreen /></div>
        <div className="lg:col-span-2">
          {vid.status === "done" && (<>
            <div className="flex flex-wrap gap-2 mb-3">
              {Tabs.map(t => <button key={t} onClick={() => setTab(t)} className={"px-3 py-1 rounded-full capitalize " + (tab === t ? "bg-indigo-600 text-white" : "bg-white shadow")}>{t}</button>)}
            </div>
            {(tab === "summary" || tab === "transcript") && (
              <div className="bg-white rounded-xl shadow p-4">
                <div className="flex flex-wrap items-center gap-2 mb-3">
                  <select className="border rounded-lg px-2 py-1" value={lang} onChange={e => setLang(e.target.value)}>{LANGS.map(l => <option key={l}>{l}</option>)}</select>
                  <Btn className="bg-purple-600 text-white hover:bg-purple-700 text-sm !py-1" disabled={busy} onClick={() => translate(tab)}>{busy ? "Translating…" : "Translate"}</Btn>
                  {tab === "summary" && <>
                    <Btn className="bg-gray-200 text-gray-800 hover:bg-gray-300 text-sm !py-1" onClick={() => { const t = translated.summary; speak(t ? t.text : vid.summary, t ? t.lang : vid.language); }}>🔊 Listen</Btn>
                    <Btn className="bg-gray-200 text-gray-800 hover:bg-gray-300 text-sm !py-1" onClick={() => window.speechSynthesis.cancel()}>⏹ Stop</Btn></>}
                  {translated[tab] && <span className="text-xs text-gray-500">Showing {translated[tab].lang} translation</span>}
                </div>
                {tab === "summary"
                  ? <Md text={translated.summary ? translated.summary.text : vid.summary} />
                  : <pre className="whitespace-pre-wrap text-sm max-h-[480px] overflow-y-auto">{translated.transcript ? translated.transcript.text : vid.transcript}</pre>}
              </div>)}
            {tab === "quiz" && <Quiz vid={vid} />}
            {tab === "flashcards" && <Cards vid={vid} />}
            {tab === "chat" && <Chat vid={vid} />}
          </>)}
        </div>
      </div>
    </div>
  );
}

/* ---------------- Dashboard / History ---------------- */
function Library({ onOpen }) {
  const [h, setH] = useState(null);
  useEffect(() => { api("/history").then(setH).catch(() => {}); }, []);
  if (!h) return <p>Loading…</p>;
  const s = h.stats;
  return (
    <div>
      <div className="grid grid-cols-3 gap-3 mb-4">
        {[["Videos analysed", s.videos_done], ["Quizzes taken", s.quizzes_taken], ["Accuracy", s.accuracy + "%"]].map(([k, v]) =>
          <div key={k} className="bg-white rounded-xl shadow p-4 text-center"><p className="text-2xl font-bold text-indigo-700">{v}</p><p className="text-sm text-gray-500">{k}</p></div>)}
      </div>
      <div className="mb-4">{s.badges.map(b => <span key={b} className="inline-block bg-amber-100 text-amber-800 rounded-full px-3 py-1 text-sm mr-2">🏅 {b}</span>)}</div>
      <div className="grid md:grid-cols-2 gap-3">
        {h.videos.map(v => (
          <div key={v.id} onClick={() => onOpen(v.id)} className="bg-white rounded-xl shadow p-3 flex gap-3 cursor-pointer hover:ring-2 ring-indigo-400">
            <img src={v.thumbnail} className="w-32 h-20 object-cover rounded-lg bg-gray-200" />
            <div><p className="font-semibold leading-tight">{v.title || v.video_id}</p><p className="text-xs text-gray-500">{v.channel} · {v.status}</p></div>
          </div>))}
      </div>
      {!h.videos.length && <p className="text-gray-500">No videos yet. Use Search to analyse your first one.</p>}
    </div>
  );
}

/* ---------------- App ---------------- */
function App() {
  const [user, setUser] = useState(localStorage.getItem("token") ? localStorage.getItem("username") : null);
  const [page, setPage] = useState("search"); const [open, setOpen] = useState(null); const [language, setLanguage] = useState("English");
  if (!user) return <Login onAuth={setUser} />;
  const logout = () => { localStorage.clear(); setUser(null); };
  return (
    <div>
      <header className="bg-indigo-700 text-white">
        <div className="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center gap-3">
          <h1 className="text-xl font-bold mr-4">E-VISTA</h1>
          <button onClick={() => { setPage("search"); setOpen(null); }} className={page === "search" && !open ? "underline" : ""}>Search</button>
          <button onClick={() => { setPage("library"); setOpen(null); }} className={page === "library" && !open ? "underline" : ""}>Dashboard</button>
          <div className="ml-auto flex items-center gap-3 text-sm">
            <label>Summary language:
              <select className="ml-1 text-black rounded px-1" value={language} onChange={e => setLanguage(e.target.value)}>{LANGS.map(l => <option key={l}>{l}</option>)}</select>
            </label>
            <span>👤 {user}</span><button className="underline" onClick={logout}>Logout</button>
          </div>
        </div>
      </header>
      <main className="max-w-6xl mx-auto p-4">
        {open ? <VideoView id={open} onBack={() => setOpen(null)} />
          : page === "search" ? <Search onOpen={setOpen} language={language} /> : <Library onOpen={setOpen} />}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
